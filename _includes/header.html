<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Meta -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0" name="viewport">
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">

    <title>
        {% if page.title %}
        {{ page.title }} | {{ site.data.global.title }}
        {% elsif post.title %}
        {{ post.title }} | {{ site.data.global.title }}
        {% else %}
        {{ site.data.global.title }}
        {% endif %}
    </title>
    <meta content="emustudio,emulator,computer emulator,emulation platform,emulation framework,vintage computer emulator,retro computing,altair 8800,MITS Altair8800,intel 8080,i8080,zilog Z80,ZX Spectrum 48K,ZX Spectrum emulator,SSEM,Manchester Baby,random access machine,RAM machine,RASP,random access stored program machine,von Neumann architecture,Harvard architecture,brainfuck,BrainDuck,assembly language,8-bit computer,toy computer,cross-platform emulator,Java emulator,computer science education,academic emulator,cpu emulator,retro programming,vintage computing"
          name="keywords">
    <meta content="{% if page.description %}{{ page.description }}{% elsif page.title %}{{ page.title }} - emuStudio documentation{% else %}emuStudio is a free, cross-platform computer emulation platform and framework. Emulate vintage computers like MITS Altair 8800, ZX Spectrum 48K, SSEM Manchester Baby, and abstract machines like RAM, RASP, and BrainDuck.{% endif %}" name="description">
    <meta content="index,follow" name="robots">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">

    <!-- Open Graph -->
    <meta content="{% if page.title %}{{ page.title }}{% elsif post.title %}{{ post.title }}{% else %}{{ site.data.global.title }}{% endif %}"
          property="og:title">
    <meta content="website" property="og:type">
    <meta content="{{ page.url | replace: 'index.html', '' | absolute_url }}" property="og:url">
    <meta content="{{ '/files/images/logo-2.svg' | absolute_url }}" property="og:image">
    <meta content="emuStudio" property="og:site_name">
    <meta content="{% if page.description %}{{ page.description }}{% elsif page.title %}{{ page.title }} - emuStudio documentation{% else %}emuStudio is a free, cross-platform computer emulation platform and framework. Emulate vintage computers like MITS Altair 8800, ZX Spectrum 48K, SSEM Manchester Baby, and abstract machines like RAM, RASP, and BrainDuck.{% endif %}" property="og:description">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.data.global.title }}{% elsif post.title %}{{ post.title }} | {{ site.data.global.title }}{% else %}{{ site.data.global.title }}{% endif %}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}Free, cross-platform computer emulation platform. Emulate Altair 8800, ZX Spectrum 48K, SSEM, RAM, RASP and more.{% endif %}">
    <meta name="twitter:image" content="{{ '/files/images/logo-2.svg' | absolute_url }}">

    <!-- RSS -->
    <link href="{{ base }}feed.xml" rel="alternate"
          title="{{ site.data.global.title }} | {{ site.data.global.description }}" type="application/rss+xml">
    <link href="{{ base }}atom.xml" rel="alternate"
          title="{{ site.data.global.title }} | {{ site.data.global.description }}" type="application/atom+xml">

    <!-- Favicons -->
    <link href="{{ base }}favicon.ico?" rel="shortcut icon" type="image/x-icon">
    <meta content="{{ site.data.global.title }} | {{ site.data.global.description }}" name="application-name">
    <meta content="#ffffff" name="msapplication-TileColor">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,300italic,400,400italic,700,700italic|Oswald:300,400,700"
          rel="stylesheet">
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/7f2db714b8.js"></script>

    <!-- Styles -->
    <link crossorigin="anonymous" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" rel="stylesheet">
    <link href="{{ base }}css/style.css" rel="stylesheet">

    <!-- Scripts -->

    <!--[if lt IE 9]>
        <script src="{{ base }}js/html5shiv.min.js"></script>
        <script src="{{ base }}js/respond.min.js"></script>
    <![endif]-->

    <script crossorigin="anonymous"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script crossorigin="anonymous"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script crossorigin="anonymous"
            integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
            src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <script async defer id="github-bjs" src="https://buttons.github.io/buttons.js"></script>

    {% if site.google_analytics_id %}
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics_id }}');
    </script>
    {% endif %}

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "emuStudio",
        "url": "{{ site.url }}",
        "description": "Free, cross-platform computer emulation platform and framework for academic use. Supports emulation of MITS Altair 8800 (Intel 8080, Zilog Z80), ZX Spectrum 48K, SSEM Manchester Baby, and abstract machines (RAM, RASP, BrainDuck).",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, Linux, macOS",
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "author": {
            "@type": "Person",
            "name": "Peter Jakubčo",
            "url": "https://github.com/vbmacher"
        }
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "emuStudio",
        "url": "{{ site.url }}",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ site.url }}/?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ site.baseurl }}/">
            <img alt="" class="d-inline-block align-top" src="{{base}}files/images/logo-2.svg" width="30px"/>
            {{ site.data.global.title }}
        </a>
        <span class="navbar-text">Computer emulation platform & framework</span>
        <button aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler"
                data-target="#mainMenu"
                data-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.nav.main %}
                <li class="nav-item {% if page.title == item.text %}active {% endif %}">
                    <a class="nav-link" href="{{ item.url | prepend: site.baseurl }}">{{ item.text }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
